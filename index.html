<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Javier Barbero | Portfolio</title>
    <meta name="theme-color" content="#f2f2f7">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* Apple-Style Intro Animation */
        #intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.2s ease 0.2s;
        }

        #intro-overlay.done {
            opacity: 0;
            pointer-events: none;
        }

        #intro-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transform: scale(1.1);
            animation: introZoom 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #intro-logo .avatar-xl {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-image: url('ft.jpeg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 60px rgba(255, 90, 0, 0.3);
        }

        #intro-logo h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        #intro-logo p {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        @keyframes introZoom {
            from {
                transform: scale(1.15);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes contentReveal {
            from {
                transform: scale(1.05);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .container {
            /* Removed contentReveal animation to prevent profile visibility issues */
            opacity: 1;
        }

        /* Magic Portada */
        .portada-section {
            width: 100%;
            height: 90vh;
            position: relative;
            margin-bottom: 48px;
            overflow: hidden;
            border-radius: 0;
            background: #000;
            box-shadow: none;
            will-change: transform;
            cursor: pointer;
        }

        .portada-section::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(0, 0, 0, 0.85) 0%,
                    rgba(0, 0, 0, 0.3) 40%,
                    transparent 100%);
            z-index: 5;
            pointer-events: none;
        }

        .portada-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .portada-content {
            position: absolute;
            bottom: 8%;
            left: 8%;
            right: 8%;
            z-index: 20;
            color: white;
            pointer-events: auto;
        }

        .portada-title {
            font-size: clamp(2.8rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 0.92;
            margin-bottom: 16px;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        /* Profile Floating Island */
        .profile-float {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: var(--modal-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--tile-border);
            padding: 8px 16px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-md);
            z-index: 2000;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer;
        }

        .profile-float.active {
            transform: translateX(-50%) translateY(0);
        }

        .profile-float .avatar {
            width: 32px;
            height: 32px;
        }

        .profile-float h2 {
            font-size: 0.9rem;
            font-weight: 700;
            margin: 0;
        }

        :root {
            --bg-color: #f2f2f7;
            --modal-bg: rgba(255, 255, 255, 0.94);
            --bar-bg: rgba(255, 255, 255, 0.8);

            --tile-bg: rgba(255, 255, 255, 0.7);
            --tile-border: rgba(255, 255, 255, 0.5);
            --tile-glow: rgba(255, 59, 48, 0.12);
            /* Warm Red/Orange glow */

            --text-primary: #000000;
            --text-secondary: #8a8a8e;

            --accent: #ff3b30;
            --accent-orange: #ff9500;
            --accent-red: #ff3b30;

            --mesh-vibrant: radial-gradient(at 0% 0%, #ff9500 0%, transparent 60%),
                radial-gradient(at 100% 0%, #ff3b30 0%, transparent 60%),
                radial-gradient(at 100% 100%, #ffffff 0%, transparent 60%),
                radial-gradient(at 0% 100%, #ff8a80 0%, transparent 60%);

            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.08);
            --shadow-float: 0 25px 60px -15px rgba(0, 0, 0, 0.18);

            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            --font-mono: "SF Mono", "Menlo", monospace;

            --radius: 24px;
            --radius-sm: 16px;
            --header-height: 64px;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --modal-bg: rgba(28, 28, 30, 0.94);
            --bar-bg: rgba(20, 20, 20, 0.8);
            --tile-bg: rgba(30, 30, 32, 0.7);
            --tile-border: rgba(255, 255, 255, 0.08);
            --tile-glow: rgba(255, 149, 0, 0.1);
            /* Warm Orange glow in dark mode */
            --text-primary: #ffffff;
            --text-secondary: #98989d;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        /* --- 2. GLOBAL RESET & UTILS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            letter-spacing: -0.015em;
            padding-top: var(--header-height);
        }

        /* Fondo con Mesh Gradient sutil */
        @keyframes mesh-animation {
            0% {
                transform: scale(1) translate(0, 0);
            }

            33% {
                transform: scale(1.1) translate(3%, 2%);
            }

            66% {
                transform: scale(0.9) translate(-2%, 4%);
            }

            100% {
                transform: scale(1) translate(0, 0);
            }
        }

        .mesh {
            position: fixed;
            inset: -10%;
            z-index: -1;
            background: var(--mesh-vibrant);
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
            animation: mesh-animation 12s infinite alternate ease-in-out;
            will-change: transform;
        }

        /* --- 3. TOP NAVIGATION BAR (Fixed & Glass) --- */
        #admin-menubar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--bar-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 5000;
            transition: 0.3s;
        }

        .menubar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menubar-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: var(--font-ui);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .menubar-btn:hover {
            background: rgba(120, 120, 120, 0.1);
        }

        .menubar-btn:active {
            transform: scale(0.96);
        }

        .menubar-btn.primary {
            font-weight: 600;
            background: rgba(0, 122, 255, 0.1);
        }

        .menubar-brand {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-right: 10px;
            cursor: default;
        }

        /* --- 4. LAYOUT --- */
        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 20px 140px;
            /* reduced top padding */
        }

        /* Header Profile & Filters */
        header {
            margin-bottom: 30px;
            position: relative;
            z-index: 100;
        }

        .sticky-filters {
            position: sticky;
            top: calc(var(--header-height) + 6px);
            z-index: 500;
            background: transparent;
            margin: 0 -20px 20px -20px;
            padding: 10px 20px;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        /* Target fix for the 'white square' look - ensure filters container is pure transparent */
        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            background: none !important;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .sticky-filters.is-stuck {
            background: var(--bar-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 1px 10px rgba(0, 0, 0, 0.02);
            /* Smooth the transition to avoid 'white square' look */
            border-top: 1px solid transparent;
        }

        [data-theme="dark"] .sticky-filters.is-stuck {
            background: rgba(10, 10, 10, 0.85);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.06);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .profile:active {
            opacity: 0.6;
        }

        /* AVATAR */
        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
            background-color: #ddd;
            background-image: url('ft.jpeg');
            background-size: cover;
            background-position: center;
        }

        .titles h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .titles p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--tile-bg);
            backdrop-filter: blur(10px);
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--accent);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.92);
            filter: brightness(0.9);
        }

        /* Filter Pills */
        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin-left: -4px;
        }

        .pill {
            border: none;
            background: rgba(0, 0, 0, 0.08);
            color: var(--text-primary);
            /* Use primary text for better visibility */
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: 800;
            /* Extra bold */
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pill:hover {
            background: rgba(120, 120, 120, 0.2);
            color: var(--text-primary);
        }

        .pill.active {
            background: var(--text-primary);
            color: var(--bg-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transform: scale(1.05);
        }

        /* --- 5. GRID SYSTEM --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 170px;
            gap: 18px;
            padding: 10px 0;
        }

        .tile {
            grid-column: span 2;
            grid-row: span 1;
            position: relative;
            background: var(--tile-bg);
            backdrop-filter: saturate(180%) blur(25px);
            -webkit-backdrop-filter: saturate(180%) blur(25px);
            border: 1px solid var(--tile-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s, border-color 0.4s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-style: preserve-3d;
        }

        .tile::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), var(--tile-glow), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 0;
        }

        .tile:hover::before {
            opacity: 1;
        }

        .tile-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tile:hover .tile-shine {
            opacity: 1;
        }

        .tile:hover {
            z-index: 10;
            transform: scale(1.03) translateY(-4px);
            box-shadow: 0 20px 40px rgba(255, 59, 48, 0.12);
            /* Warm tinted shadow */
            border-color: rgba(255, 59, 48, 0.4);
        }

        .tile:active {
            transform: scale(0.97) translateY(0);
            transition: 0.1s;
        }

        .tile.visited {
            opacity: 0.9;
        }

        .tile.small {
            grid-column: span 1;
        }

        .tile.wide {
            grid-column: span 4;
        }

        .tile.tall {
            grid-column: span 2;
            grid-row: span 2;
        }

        .tile.portrait {
            grid-column: span 1;
            grid-row: span 2;
        }

        .tile.extra-wide {
            grid-column: span 4;
            grid-row: span 2;
        }

        .tile-icon img,
        .tile-icon svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Standard Content */
        .tile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .tile-icon {
            font-size: 1.8rem;
        }

        .tile-titles h3 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .tile-titles p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.35;
        }

        /* Background Images */
        .tile.has-bg {
            border: none;
        }

        .tile.has-bg .tile-titles h3,
        .tile.has-bg .tile-titles p {
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .tile-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            transition: transform 0.6s;
        }

        .tile:hover .tile-bg {
            transform: scale(1.08);
        }

        .tile-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5) 10%, transparent 80%);
            z-index: 0;
            pointer-events: none;
        }

        .tile-content {
            z-index: 1;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- 6. WIDGET STYLES --- */
        .music-card {
            display: flex;
            align-items: center;
            gap: 14px;
            height: 100%;
        }

        .album-art {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            box-shadow: var(--shadow-sm);
            object-fit: cover;
        }

        .music-info {
            flex: 1;
            min-width: 0;
        }

        .music-bars {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 12px;
            margin-top: 6px;
        }

        .bar {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            animation: sound 0.8s infinite ease-in-out alternate;
        }

        .bar:nth-child(2) {
            animation-delay: 0.2s;
            height: 60%;
        }

        .bar:nth-child(3) {
            animation-delay: 0.4s;
            height: 80%;
        }

        .bar:nth-child(4) {
            animation-delay: 0.1s;
            height: 40%;
        }

        @keyframes sound {
            from {
                height: 20%;
            }

            to {
                height: 100%;
            }
        }

        .map-wrap {
            border-radius: var(--radius);
            overflow: hidden;
            position: absolute;
            inset: 0;
        }

        .map-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: 0.3s;
        }

        .tile:hover .map-img {
            opacity: 1;
        }

        .radar-dot {
            width: 12px;
            height: 12px;
            background: #007aff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 2px white;
            z-index: 2;
        }

        .radar-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: rgba(0, 122, 255, 0.4);
            border-radius: 50%;
            animation: pulse 2s infinite;
            z-index: 1;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, -50%) scale(5);
                opacity: 0;
            }
        }

        .weather-main {
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.15);
        }

        .temp-big {
            font-size: 3.2rem;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
        }

        .insta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            height: 100%;
            align-content: center;
        }

        .insta-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            transition: 0.2s;
        }

        .link-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .link-item {
            font-size: 0.8rem;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            transition: 0.2s background;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        [data-theme="dark"] .link-item {
            background: rgba(255, 255, 255, 0.1);
        }

        [data-theme="dark"] .link-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* EDITOR STYLES */
        .app-btn {
            background: #eff1f5;
            color: var(--accent);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        [data-theme="dark"] .app-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .editor-input,
        .editor-select,
        .cmd-input {
            background: rgba(120, 120, 120, 0.1);
            border: none;
            padding: 14px;
            border-radius: 12px;
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: 0.2s;
        }

        .editor-input:focus {
            background: rgba(120, 120, 120, 0.15);
            box-shadow: 0 0 0 2px var(--accent);
        }

        .editor-card {
            background: rgba(255, 255, 255, 0.5);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] .editor-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Estilos para el Editor de Bloques */
        .block-item {
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] .block-item {
            background: rgba(255, 255, 255, 0.1);
        }

        .block-handle {
            cursor: grab;
            color: var(--text-secondary);
            padding-top: 12px;
        }

        .block-content {
            flex: 1;
        }

        .block-remove {
            color: var(--danger);
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
        }

        /* --- 7. SHEETS & MODALS --- */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 6000;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s;
        }

        .sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sheet {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 680px;
            height: 85vh;
            background: var(--modal-bg);
            backdrop-filter: saturate(180%) blur(40px);
            -webkit-backdrop-filter: saturate(180%) blur(40px);
            border-radius: 30px 30px 0 0;
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: var(--shadow-float);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sheet-overlay.active .sheet {
            transform: translateX(-50%) translateY(0);
        }

        .sheet-header {
            padding: 24px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 30px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .article-title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .article-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .article-body {
            font-size: 1.15rem;
            line-height: 1.75;
            color: var(--text-primary);
        }

        .article-body p {
            margin-bottom: 24px;
        }

        .article-image {
            width: 100%;
            border-radius: 20px;
            margin: 30px 0;
            box-shadow: var(--shadow-md);
            transition: transform 0.3s;
        }

        .article-image:hover {
            transform: scale(1.01);
        }

        .app-store-block {
            background: var(--tile-bg);
            border: 1px solid var(--tile-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            margin: 30px 0;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: 0.2s;
        }

        .app-store-block:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        [data-theme="dark"] .app-store-block:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Cmd+K Overlay */
        .cmd-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            z-index: 7000;
            display: flex;
            justify-content: center;
            padding-top: 20vh;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }

        .cmd-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        [data-theme="dark"] .cmd-overlay {
            background: rgba(0, 0, 0, 0.85);
        }

        .cmd-box {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .cmd-item {
            padding: 15px;
            border-bottom: 1px solid rgba(120, 120, 120, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
        }

        .cmd-item:hover {
            background: rgba(120, 120, 120, 0.05);
        }

        /* Notifications (iOS Island Style) */
        .notification-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            z-index: 9000;
            width: calc(100% - 40px);
            max-width: 400px;
            background: var(--modal-bg);
            backdrop-filter: saturate(180%) blur(30px);
            -webkit-backdrop-filter: saturate(180%) blur(30px);
            padding: 16px 20px;
            border-radius: 28px;
            box-shadow: var(--shadow-float);
            border: 1px solid var(--tile-border);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .notification-container.active {
            transform: translateX(-50%) translateY(0);
        }

        .notification-icon {
            width: 38px;
            height: 38px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
        }

        .notification-text h4 {
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .notification-text p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Parallax Classes */
        .parallax-item {
            will-change: transform, opacity;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .portada-section {
                /* On mobile: full viewport height, no gap from header */
                height: 100svh;
                /* Use safe viewport height to avoid notch issues */
                border-radius: 0;
                margin-bottom: 32px;
                /* Pull it above the body's padding-top to fill full screen */
                margin-top: calc(-1 * var(--header-height));
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }

            .tile {
                grid-column: span 1;
            }

            .tile.wide {
                grid-column: span 2;
            }

            .tile.tall {
                grid-column: span 1;
                grid-row: span 2;
            }

            .tile.portrait {
                grid-column: span 1;
                grid-row: span 2;
            }

            .tile.extra-wide {
                grid-column: span 2;
                grid-row: span 2;
            }

            .temp-big {
                font-size: 2.5rem;
            }

            .sheet {
                height: 92vh;
            }
        }

        /* ============================================
           QUIEN SOY SECTION
           ============================================ */
        #quien-soy-container {
            width: 100%;
            display: none;
            /* shown only when filter === 'all' */
        }

        .qs-section {
            width: 100%;
            padding: 120px 20px 160px;
            max-width: 900px;
            margin: 0 auto 80px;
            position: relative;
            overflow: hidden;
        }

        /* Orbit scene */
        .qs-orbit-scene {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 280px;
            margin: 0 auto 100px;
            flex-shrink: 0;
        }

        .qs-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-image: url('ft.jpeg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 60px rgba(255, 59, 48, 0.25), 0 0 0 4px rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 10;
            transition: box-shadow 0.4s;
        }

        .qs-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qs-ring-1 {
            width: 170px;
            height: 170px;
            border-color: rgba(255, 59, 48, 0.2);
        }

        .qs-ring-2 {
            width: 220px;
            height: 220px;
            border-color: rgba(255, 149, 0, 0.15);
        }

        .qs-ring-3 {
            width: 270px;
            height: 270px;
            border-color: rgba(255, 59, 48, 0.1);
        }

        .qs-orbit-chip {
            position: absolute;
            background: white;
            color: #111;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.4s, transform 0.4s;
            letter-spacing: -0.02em;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] .qs-orbit-chip {
            background: rgba(40, 40, 42, 0.95);
            color: white;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .qs-orbit-chip.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Header */
        .qs-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .qs-label {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .qs-title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            margin-bottom: 12px;
            line-height: 1;
        }

        .qs-bio {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 500;
        }

        /* Layout */
        .qs-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            margin-top: 100px;
        }

        @media (max-width: 768px) {
            .qs-layout {
                grid-template-columns: 1fr;
            }

            .qs-orbit-scene {
                width: 220px;
                height: 220px;
            }

            .qs-ring-1 {
                width: 140px;
                height: 140px;
            }

            .qs-ring-2 {
                width: 180px;
                height: 180px;
            }

            .qs-ring-3 {
                width: 220px;
                height: 220px;
            }

            .qs-title {
                font-size: 1.8rem;
            }
        }

        /* Cards */
        .qs-card {
            background: var(--tile-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--tile-border);
            border-radius: 24px;
            padding: 24px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .qs-card.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .qs-card-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qs-card-title svg {
            opacity: 0.8;
        }

        /* Education Timeline */
        .qs-timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .qs-timeline-item {
            display: flex;
            gap: 16px;
            position: relative;
        }

        .qs-timeline-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .qs-timeline-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-secondary);
            border: 2.5px solid var(--bg-color);
            box-shadow: 0 0 0 2px var(--text-secondary);
            flex-shrink: 0;
            margin-top: 3px;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .qs-timeline-dot.active {
            background: var(--accent);
            box-shadow: 0 0 0 2px var(--accent), 0 4px 12px rgba(255, 59, 48, 0.3);
        }

        .qs-timeline-line {
            width: 2px;
            flex: 1;
            background: linear-gradient(to bottom, var(--tile-border), transparent);
            min-height: 24px;
            margin: 4px auto;
        }

        .qs-timeline-content {
            padding-bottom: 24px;
        }

        .qs-timeline-title {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 2px;
        }

        .qs-timeline-place {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .qs-timeline-year {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
        }

        /* Chips grid */
        .qs-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .qs-chip {
            background: rgba(255, 59, 48, 0.07);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 59, 48, 0.15);
            letter-spacing: -0.01em;
        }

        [data-theme="dark"] .qs-chip {
            background: rgba(255, 149, 0, 0.1);
            color: var(--accent-orange);
            border-color: rgba(255, 149, 0, 0.2);
        }

        /* Full-width bio card */
        .qs-full {
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

    <!-- FX Layers -->
    <div id="intro-overlay">
        <div id="intro-logo">

            <div style="text-align:center;">

    <div class="mesh"></div>

    <!-- Custom Admin Login Modal -->

        onclick="if(event.target===this)closeLoginModal()">

            <div
                style="width:52px;height:52px;border-radius:14px;background:var(--accent,#ff3b30);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">

                document.querySelectorAll('.live-clock').forEach(el => {

        function handleTileClick(p) {
            playSound('click');
            const tileEl = document.getElementById(`tile-${p.id}`);
            if (tileEl) tileEl.classList.add('visited'); // Only if tile exists in grid
            if (p.widget === 'cv' && p.custom.fileUrl) return window.open(p.custom.fileUrl, '_blank');
            if (p.action === 'link' && p.url) return window.open(p.url, '_blank');
            openSheet(p);
        }

        function openSheet(p) {
            const sheet = document.getElementById('sheet-main');
            const body = document.getElementById('sheet-body');
            const title = document.getElementById('sheet-title');

            title.innerText = p.title || "Detalle";

            // GSAP Sheet Animation
            gsap.set(sheet, { y: "100%" });
            document.getElementById('sheet-overlay').classList.add('active');
            gsap.to(sheet, { y: 0, duration: 0.6, ease: "expo.out" });

            const fullContent = getWidgetFullContent(p);

            if (fullContent && p.widget !== 'standard') {
                body.innerHTML = fullContent;
            } else {
                // Render moderno de artículo
                let html = `<div class="article-container">`;

                if (p.bgImage) html += `<img src="${p.bgImage}" class="article-image" style="height:400px; object-fit:cover;">`;

                html += `<h1 class="article-title">${p.title}</h1>`;
                html += `<div class="article-meta" style="display:flex; gap:15px; margin-bottom:25px; font-size:0.85rem; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">
                    <span style="display:flex; align-items:center; gap:6px;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        ${p.category.toUpperCase()}
                    </span>
                    <span style="display:flex; align-items:center; gap:6px;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        ${new Date(p.id).toLocaleDateString()}
                    </span>
                </div>`;

                html += `<div class="article-body">`;

                if (p.blocks && p.blocks.length > 0) {
                    p.blocks.forEach(b => {
                        if (b.type === 'text') {
                            html += `<p>${b.content.replace(/\n/g, '<br>')}</p>`;
                        } else if (b.type === 'image') {
                            html += `<img src="${b.url}" class="article-image">`;
                        } else if (b.type === 'appstore') {
                            html += `<div class="app-store-block" onclick="window.open('${b.url}', '_blank')">
                                <img src="${b.icon || 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/1a/d0/52/1ad05212-8063-2a70-1999-e052e65790e6/Placeholder.mill/400x400bb-75.webp'}" style="width:64px; height:64px; border-radius:14px;">
                                <div style="flex:1">
                                    <h4 style="margin:0; font-size:1.1rem">${b.name || 'App Title'}</h4>
                                    <p style="margin:2px 0 0; font-size:0.85rem; color:var(--text-secondary)">Download on the App Store</p>
                                </div>
                                <button class="app-btn">GET</button>
                            </div>`;
                        }
                    });
                } else {
                    html += `<p>${p.desc}</p>`;
                }

                if (p.url) html += `<div style="margin-top:40px; text-align:center;"><a href="${p.url}" target="_blank" class="pill active" style="padding:16px 48px; text-decoration:none; font-size:1.1rem">Ver Proyecto Online</a></div>`;

                if (p.custom && p.custom.appStoreLink) {
                    html += `<div style="margin-top:20px; text-align:center;">
                        <a href="${p.custom.appStoreLink}" target="_blank">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" style="height:44px;">
                        </a>
                    </div>`;
                }

                html += `</div></div>`;

                // Animate article content
                gsap.from(".article-container > *", { opacity: 0, y: 20, stagger: 0.1, duration: 0.8, ease: "expo.out", delay: 0.2 });
            }
        }

        function playSound(type) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            if (type === 'click') { osc.frequency.value = 600; gain.gain.value = 0.05; osc.start(); osc.stop(audioContext.currentTime + 0.05); }
            if (type === 'hover') { osc.frequency.value = 300; gain.gain.value = 0.01; osc.start(); osc.stop(audioContext.currentTime + 0.03); }
            if (type === 'switch') { osc.frequency.value = 400; gain.gain.value = 0.05; osc.type = 'triangle'; osc.start(); osc.stop(audioContext.currentTime + 0.1); }
            if (type === 'pop') { osc.frequency.value = 800; gain.gain.value = 0.05; osc.type = 'sine'; osc.start(); osc.stop(audioContext.currentTime + 0.1); }
        }

        function setupListeners() {
            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); toggleCmd(); }
                if (e.key === 'Escape') { closeSheet(); document.getElementById('cmd-overlay').classList.remove('active'); }
            });
            document.getElementById('cmd-input').addEventListener('input', (e) => renderCmdResults(e.target.value));
        }

        function toggleCmd() {
            document.getElementById('cmd-overlay').classList.toggle('active');
            if (document.getElementById('cmd-overlay').classList.contains('active')) {
                document.getElementById('cmd-input').focus();
                renderCmdResults('');
            }
        }

        function renderCmdResults(q) {
            const list = document.getElementById('cmd-list');
            list.innerHTML = '';
            const term = q.toLowerCase();

            const system = [
                { title: 'Cambiar Tema', action: toggleTheme },
                { title: 'Abrir Ayuda', action: openHelp },
                { title: 'Admin Login', action: toggleAdmin }
            ];

            const matches = state.projects.filter(p => p.title.toLowerCase().includes(term));

            [...system, ...matches].forEach(item => {
                const div = document.createElement('div');
                div.className = 'cmd-item';
                div.innerHTML = `<span>${item.title}</span> <span style="font-size:0.7rem; color:var(--text-secondary); background:rgba(0,0,0,0.05); padding:2px 6px; border-radius:4px; font-weight:700; letter-spacing:0.5px;">ENTER</span>`;
                div.onclick = () => {
                    (item.action || (() => handleTileClick(item)))();
                    toggleCmd();
                };
                list.appendChild(div);
            });

                    new Sortable(document.getElementById('grid'), {

        function initQuienSoyAnimations() {
            // Remove existing QS triggers
            ScrollTrigger.getAll().filter(t => t.vars._qs).forEach(t => t.kill());

            const scene = document.getElementById('qs-orbit-scene');
            if (!scene) return;

            const ring1 = document.getElementById('qs-ring-1');
            const ring2 = document.getElementById('qs-ring-2');
            const ring3 = document.getElementById('qs-ring-3');

            // Ring rotation on scroll
            if (ring1) {
                gsap.to(ring1, {
                    rotation: 360,
                    ease: "none",
                    scrollTrigger: { trigger: scene, start: "top 80%", end: "bottom 20%", scrub: 2, _qs: true }
                });
            }
            if (ring2) {
                gsap.to(ring2, {
                    rotation: -360,
                    ease: "none",
                    scrollTrigger: { trigger: scene, start: "top 80%", end: "bottom 20%", scrub: 3, _qs: true }
                });
            }
            if (ring3) {
                gsap.to(ring3, {
                    rotation: 180,
                    ease: "none",
                    scrollTrigger: { trigger: scene, start: "top 80%", end: "bottom 20%", scrub: 4, _qs: true }
                });
            }

            // Chips appear one by one on scroll
            const chips = document.querySelectorAll('.qs-orbit-chip');
            chips.forEach((chip, i) => {
                ScrollTrigger.create({
                    trigger: scene,
                    start: `top ${75 - i * 5}%`,
                    _qs: true,
                    onEnter: () => chip.classList.add('visible'),
                    onLeaveBack: () => chip.classList.remove('visible')
                });
            });

            // Scroll-reveal cards
            const cards = document.querySelectorAll('.qs-card');
            cards.forEach((card, i) => {
                ScrollTrigger.create({
                    trigger: card,
                    start: "top 85%",
                    _qs: true,
                    onEnter: () => {
                        setTimeout(() => card.classList.add('revealed'), i * 120);
                    }
                });
            });

            ScrollTrigger.refresh();
        }

                    conf.fields.forEach(f => {
                        const placeholder = (conf.placeholder && conf.placeholder[f]) ? conf.placeholder[f] : '';
                        const label = f.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                        fieldsHtml += `<div style="margin-bottom:12px"><label style="font-size:0.75rem; opacity:0.6; margin-bottom:4px; display:block;">${label}</label><input class="editor-input custom-field-input" data-key="${f}" value="${(p.custom || {})[f] || ''}" placeholder="${placeholder}"></div>`;
                    });
                }
                document.getElementById('ed-custom-fields').innerHTML = fieldsHtml || '<div style="opacity:0.5; font-size:0.9rem;">Este widget no requiere configuración extra.</div>';

                // Toggle Block Editor
                const isStandard = type === 'standard';
                document.getElementById('block-editor-container').style.display = isStandard ? 'block' : 'none';
                document.getElementById('project-options').style.display = isStandard ? 'block' : 'block'; // Mostrar siempre por si acaso

                // Load existing blocks if standard
                const list = document.getElementById('blocks-list');
                list.innerHTML = ''; // Clear first
                if (isStandard && p.blocks && p.blocks.length > 0) {
                    p.blocks.forEach(b => window.addEditorBlock(b.type, b.type === 'text' ? b.content : b.url));
                }

                // Habilitar Sortable para los bloques
                if (isStandard) {
                    new Sortable(list, { handle: '.block-handle', animation: 150 });
                }
            };

            window.renderEditorFields();
        }

        function saveProject(id) {
            const isNew = !state.projects.find(x => x.id === id);
            const custom = {};
            document.querySelectorAll('.custom-field-input').forEach(i => custom[i.dataset.key] = i.value);

            // Guardar Bloques
            const blocks = [];
            document.querySelectorAll('.block-item').forEach(el => {
                const type = el.dataset.type;
                const val = el.querySelector('.block-input').value;
                if (val.trim()) {
                    if (type === 'text') blocks.push({ type: 'text', content: val });
                    else blocks.push({ type: 'image', url: val });
                }
            });

            const newData = {
                id: id,
                title: document.getElementById('ed-title').value,
                desc: document.getElementById('ed-desc').value,
                category: document.getElementById('ed-cat').value,
                shape: document.getElementById('ed-shape').value,
                widget: document.getElementById('ed-widget').value,
                bgImage: document.getElementById('ed-bg').value,
                url: document.getElementById('ed-url').value,
                isPortada: document.getElementById('ed-isPortada').checked,
                custom: custom,
                blocks: blocks
            };

            // Ensure only one Portada exists
            if (newData.isPortada) {
                state.projects.forEach(p => p.isPortada = false);
            }

            if (isNew) state.projects.push(newData);
            else { const idx = state.projects.findIndex(x => x.id === id); state.projects[idx] = newData; }

            saveData();
            // closeSheet(); // Remove closeSheet for continuity
            renderGrid();
            showNotification("Cambios Guardados", "El proyecto se ha actualizado correctamente.");
        }

        function openGlobalSettings() {
            const html = `
        <div style="padding-bottom:40px;">
            <h2 style="margin-bottom:20px;">Ajustes Globales</h2>
            
            <div class="editor-card">
                <label style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span style="font-weight:600;">Mostrar botón de Ayuda</span>
                    <input type="checkbox" id="cfg-showHelp" ${state.config.showHelp ? 'checked' : ''} style="width:20px; height:20px;">
                </label>
                <p style="font-size:0.8rem; color:var(--text-secondary); margin-top:8px;">Si se desactiva, solo el administrador verá el botón.</p>
            </div>

            <div class="editor-card">
                <label style="display:block; margin-bottom:8px; font-weight:700; font-size:0.8rem; text-transform:uppercase; color:var(--text-secondary)">Contenido Ventana Ayuda</label>
                <input class="editor-input" id="cfg-helpTitle" value="${state.config.helpTitle}" placeholder="Título (ej: Hola)" style="margin-bottom:10px;">
                <textarea class="editor-input" id="cfg-helpContent" rows="6" placeholder="HTML permitido (<p>, <b>, etc)">${state.config.helpContent}</textarea>
            </div>

            <button class="pill active" style="width:100%; justify-content:center; padding:16px;" onclick="saveGlobalSettings()">Guardar Configuración</button>
        </div>
    `;
            document.getElementById('sheet-title').innerText = "Ajustes";
            document.getElementById('sheet-body').innerHTML = html;
            document.getElementById('sheet-overlay').classList.add('active');
        }

        function saveGlobalSettings() {
            state.config.showHelp = document.getElementById('cfg-showHelp').checked;
            state.config.helpTitle = document.getElementById('cfg-helpTitle').value;
            state.config.helpContent = document.getElementById('cfg-helpContent').value;

            localStorage.setItem('portfolio_config', JSON.stringify(state.config));
            updateHelpVisibility();
            alert("Configuración guardada correctamente");
            closeSheet();
        }

    </script>
</body>
